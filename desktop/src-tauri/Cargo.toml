[package]
name = "wispers-access-desktop"
version = "1.1.0"
description = "The Wispers Access desktop app — browse web apps without having to publish them to the internet"
edition = "2024"
# sysinfo's.
rust-version = "1.95"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wispers_access_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
keyring-core = "1"
# Native alerts before the window exists.
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Reads a share's PEM certificates for the user's certificate store.
rustls-pki-types = "1"
wispers-access-sdk = { path = "../../sdk" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Installs a share's certificates in the login keychain (certificate_store).
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
# Installs a share's certificates in the user's root store (certificate_store).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# The Secret Service needs an async runtime and a crypto backend picked.
# async-io is the one zbus already runs on here (via rfd, the opener and
# single-instance plugins); Rust crypto saves depending on the system OpenSSL.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
