# Wispers Access on Coolify — paste as a "Docker Compose Empty" resource.
#
# A thin recipe over the generic waserver container (see waserver/docker/). It
# fronts one or more *private* Coolify apps (no domain, no published ports) and
# makes them reachable through Wispers Access instead of the public Internet —
# you hand out invite codes, not a URL. One waserver container per server hosts
# many shares, so "expose another app" is an [[app]] block in a share's config,
# not a new container.
#
# Setup in Coolify:
#   1. New Resource → Docker Compose Empty → paste this file. In the
#      Environment Variables tab, SHARE_NAME is the share's name as guests
#      see it. Only for a share on Wispers Connect, set SHARE_TRANSPORT to
#      wispers-connect and WC_API_KEY to your Wispers Connect API key
#      (WC_BACKEND, optional: base URL of a self-hosted hub, https only).
#      Deploy.
#   2. Give each app you want to front a stable network name (Coolify renames
#      application containers on every redeploy):
#        - application (git/Dockerfile/image): set "Custom Network Aliases" in
#          its Network settings, e.g. odoo
#        - compose resource / one-click service: its service name already works
#      and enable "Connect To Predefined Network" on it. Give it no domain and
#      no published ports.
#   3. Open this resource's Terminal. It greets you with the share's state
#      and the commands below. Add the apps:
#        waserver edit default
#      one block per app, <alias> being the stable name from step 2:
#        [[app]]
#        id = "odoo"
#        name = "Odoo"
#        upstream = "odoo:8069"
#      Save; the server reloads with it.
#   4. Hand out access, from the same Terminal:
#        waserver invite default "Alice's phone" alice@example.com   # code + QR
#        waserver status default                                     # guests
#        waserver revoke default <number>                            # cut one off
#
# Changing a share later is `waserver edit default` again. The config lives on
# the volume below, so redeploys and image updates keep it.
#
# The only Coolify-specific token here is the network name 'coolify'. On plain
# compose, use any shared external network.
#
services:
  waserver:
    image: ghcr.io/s-te-ch/wispers/access/waserver:0.6.0
    restart: unless-stopped
    networks:
      - coolify
    environment:
      # The share the container creates on its first deploy. These come up as
      # fields in Coolify's Environment Variables tab, pre-filled with the
      # text after ':-'. Leave the Wispers Connect ones blank for iroh.
      SHARE_ID: ${SHARE_ID:-default}
      SHARE_NAME: ${SHARE_NAME:-My Apps}
      SHARE_TRANSPORT: ${SHARE_TRANSPORT:-iroh}
      WC_API_KEY: ${WC_API_KEY:-}
      WC_BACKEND: ${WC_BACKEND:-}
      # The editor `waserver edit` opens; nano when blank.
      EDITOR: ${EDITOR:-}
    volumes:
      # Persists share identity (keys + registration) and config across
      # redeploys. REQUIRED — without it, every redeploy mints a new share and
      # existing invites stop working.
      - waserver-state:/data

volumes:
  waserver-state:

networks:
  # Join Coolify's shared network so the container can reach apps by their alias.
  coolify:
    external: true
