; Base supervisord config. Per-share programs are generated by entrypoint.sh
; into conf.d/ at boot and pulled in via [include] below.

[supervisord]
nodaemon=true              ; run in the foreground as PID 1
user=root
logfile=/dev/stdout        ; surface supervisord's own lifecycle events
logfile_maxbytes=0         ; 0 = no rotation (required for a char device)
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
