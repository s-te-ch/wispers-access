# The waserver container next to an app in the same stack: Excalidraw, with no
# published ports, reachable only through the share. Uses the released image;
# `docker compose up --build` builds waserver from this checkout instead.
#
#   docker compose up -d
#   docker compose exec waserver waserver invite demo "My phone" me@example.com
#
# Redeem the invite from a Wispers Access client: the whiteboard opens with
# the Wispers logo drawn on it. The share's apps are in demo.toml.

name: wispers-demo

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    volumes:
      # First visit opens the logo; see the file.
      - ./excalidraw.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wispers.excalidraw:/usr/share/nginx/html/wispers.excalidraw:ro

  waserver:
    image: ghcr.io/s-te-ch/wispers/access/waserver:latest
    build:
      context: ../..              # repo root, so the Rust workspace is in scope
      dockerfile: waserver/docker/Dockerfile
    environment:
      # The share the container creates on its first start; its name comes
      # from demo.toml. iroh unless SHARE_TRANSPORT=wispers-connect, which
      # also needs WC_API_KEY.
      SHARE_ID: demo
      WC_API_KEY: ${WC_API_KEY:-}
    volumes:
      - waserver-state:/data      # share identity and state, across restarts
      - ./demo.toml:/config/demo.toml   # the share's config, see the file
    depends_on:
      - excalidraw

volumes:
  waserver-state:
