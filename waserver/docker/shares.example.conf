# waserver share config — one share per line:
#
#     name | display name | upstream
#
#   name        share id (alphanumeric, '-' or '_'); becomes the IPC + state key
#   display     human-readable name shown in the Wispers connectivity group
#   upstream    where to proxy: host:port on the Docker network, or a bare port
#               (host defaults to 127.0.0.1). A Docker compose service is just
#               its service name, e.g. app:8080.
#
# Lines starting with '#' and blank lines are ignored. Editing this file and
# restarting the container reconciles the running shares.

demo | WS Echo Demo | app:8080
