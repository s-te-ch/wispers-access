# nginx config for the Excalidraw container in compose.yaml, replacing the
# image's default server. The app opens with the Wispers logo as the drawing
# unless the browser already has a drawing of its own. Excalidraw keeps the
# drawing in the browser's local storage, which only script on this origin
# can see, so a few lines of script are spliced into the app's page: they look
# there before the app starts and, when there is nothing to keep, name the
# logo scene in the URL fragment (`#url=`), which Excalidraw loads and then
# drops. Splicing it into index.html, rather than serving a page of our own
# at /, is what makes it survive the app's service worker, which answers
# navigations from its cached copy of index.html.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter_once on;
        sub_filter '<head>' '<head><script>(function () {
  if (location.hash) return;
  var saved = false;
  try {
    saved = JSON.parse(localStorage.getItem("excalidraw") || "[]").some(function (e) { return !e.isDeleted; });
  } catch (e) {}
  if (!saved) location.replace(location.pathname + "#url=/wispers.excalidraw");
})();</script>';
    }
}
