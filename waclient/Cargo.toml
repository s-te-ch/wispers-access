[package]
name = "waclient"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
dirs = "5"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
slug = "0.1.6"
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5.0"
rustls = "0.23"
tokio = { version = "1", features = ["io-util", "macros"] }
wispers-connect = "0.9.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
