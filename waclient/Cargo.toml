[package]
name = "waclient"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = "0.23"
tokio = "1"
wispers-connect = "0.9.0"
quic_stream_io = { path = "../lib/quic_stream_io" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
