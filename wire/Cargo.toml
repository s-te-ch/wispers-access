[package]
name = "wispers-access-wire"
version = "0.1.0"
edition = "2024"
description = "The Wispers Access wire contract: stream framing and control messages between guests and waserver"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
