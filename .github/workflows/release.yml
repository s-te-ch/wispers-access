# Per-component releases, triggered by version tags:
#
#   waserver-vX.Y.Z  -> linux amd64+arm64 + macOS arm64 binaries (.tar.gz) and
#                       a windows amd64 one (.zip) on a GitHub Release, plus the
#                       multi-arch container image on ghcr (:X.Y.Z, :latest)
#   waclient-vX.Y.Z  -> the same binaries on a GitHub Release
#
# The tag must match the crate version in Cargo.toml, so a release is:
#  1. bump the version, commit & push
#  2. tag that commit, push the tag.
#
# All binaries and image slices are built on native runners for their
# architecture.
#
# macOS binaries are Developer ID-signed and notarized so Gatekeeper accepts
# browser-downloaded tarballs. (The Windows binary is not signed: the
# Authenticode certificate lives on the desktop release machine, not in CI.)
# This needs five repo secrets:
#   MACOS_SIGN_P12           base64 of the Developer ID Application .p12
#   MACOS_SIGN_P12_PASSWORD  its passphrase
#   APPLE_API_KEY_ID         App Store Connect API key for notarytool
#   APPLE_API_ISSUER_ID      (Developer role is sufficient)
#   APPLE_API_KEY            contents of the .p8 private key
#
# Third-party actions are pinned to commit SHAs instead of version tags, so the
# publisher can't change the tag and make us run something we don't want.

name: Release

on:
  push:
    tags:
      - "waserver-v*"
      - "waclient-v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/s-te-ch/wispers/access/waserver

jobs:
  # Parses the tag into component + version, verifies it against Cargo.toml,
  # and emits the build matrix for that component.
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: parse
        run: |
          tag="$GITHUB_REF_NAME"
          component="${tag%-v*}"
          version="${tag#*-v}"

          case "$component" in
            waserver)
              matrix='[{"os": "ubuntu-24.04", "target": "linux-amd64"},
                       {"os": "ubuntu-24.04-arm", "target": "linux-arm64"},
                       {"os": "macos-26", "target": "macos-arm64"},
                       {"os": "windows-2025", "target": "windows-amd64"}]'
              ;;
            waclient)
              matrix='[{"os": "ubuntu-24.04", "target": "linux-amd64"},
                       {"os": "ubuntu-24.04-arm", "target": "linux-arm64"},
                       {"os": "macos-26", "target": "macos-arm64"},
                       {"os": "windows-2025", "target": "windows-amd64"}]'
              ;;
            *)
              echo "unexpected tag '$tag'" >&2
              exit 1
              ;;
          esac

          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r ".packages[] | select(.name == \"$component\") | .version")
          if [ "$version" != "$crate_version" ]; then
            echo "tag says $version but $component/Cargo.toml says $crate_version" >&2
            exit 1
          fi

          {
            echo "component=$component"
            echo "version=$version"
            echo "matrix=$(echo "$matrix" | jq -c .)"
          } >> "$GITHUB_OUTPUT"

  binaries:
    needs: meta
    strategy:
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Windows builds BoringSSL and AWS-LC from source, which takes a while.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same native build deps as CI (boring-sys needs libclang, tonic/prost
      # need protoc), with the same apt hardening against stalled mirrors.
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          $APT update
          $APT install -y --no-install-recommends protobuf-compiler libclang-dev
      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: brew install protobuf
      # As in CI: MSVC, cmake and LLVM are preinstalled; NASM and protoc are not.
      - name: Install native build deps (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          choco install --no-progress -y nasm protoc
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)
        with:
          toolchain: stable

      # On Windows, link the C runtime statically: VCRUNTIME140.dll is not
      # part of Windows, so a downloaded exe could otherwise fail to start.
      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p ${{ needs.meta.outputs.component }}

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          component="${{ needs.meta.outputs.component }}"
          binary="target/release/$component"

          # One-off keychain so no key material outlives the job.
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "no Developer ID Application identity in the keychain" >&2
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --sign "$identity" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          # A bare executable can't have a ticket stapled to it; Gatekeeper
          # looks the ticket up online by signature, so submit+accept is
          # enough. The zip is only the submission vehicle.
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/apikey.p8"
          ditto -c -k "$binary" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/apikey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait --timeout 20m --output-format json | tee notarize.json
          status=$(jq -r .status notarize.json)
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id notarize.json)" \
              --key "$RUNNER_TEMP/apikey.p8" --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID" || true
            echo "notarization ended as '$status'" >&2
            exit 1
          fi
          rm "$RUNNER_TEMP/apikey.p8" notarize.json

      - name: Clean up signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true

      - name: Package
        run: |
          component="${{ needs.meta.outputs.component }}"
          version="${{ needs.meta.outputs.version }}"
          target="${{ matrix.target }}"
          staging="$component-$version-$target"
          mkdir "$staging"
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows users expect a zip, which Explorer opens natively.
            cp "target/release/$component.exe" LICENSE "$staging/"
            7z a -tzip "$staging.zip" "$staging"
          else
            cp "target/release/$component" LICENSE "$staging/"
            tar czf "$staging.tar.gz" "$staging"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # waserver only: build each image slice natively and push by digest ...
  image:
    needs: meta
    if: needs.meta.outputs.component == 'waserver'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: waserver/docker/Dockerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  # ... then stitch the per-arch digests into one multi-arch manifest.
  image-manifest:
    needs: [meta, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          version="${{ needs.meta.outputs.version }}"
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:$version" -t "$IMAGE:latest" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"

  # Creates the GitHub Release once everything that applies has succeeded.
  # image-manifest is legitimately skipped for waclient tags, hence the
  # explicit condition instead of a plain `needs`. But for waserver it must
  # have succeeded (a skip there means the image jobs failed).
  release:
    needs: [meta, binaries, image-manifest]
    if: >-
      always() && needs.binaries.result == 'success' &&
      (needs.meta.outputs.component != 'waserver' || needs.image-manifest.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      # Create-or-update: reruns (e.g. after a failed image job) land in the
      # upload branch instead of tripping over the already-created release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # Not every component has zips.
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          sha256sum -- "${archives[@]}" > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${archives[@]}" SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "${{ needs.meta.outputs.component }} ${{ needs.meta.outputs.version }}" \
              --generate-notes \
              "${archives[@]}" SHA256SUMS
          fi
